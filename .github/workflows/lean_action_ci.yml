name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          deploy: false
      - name: Upload documentation artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/
      - name: Audit axioms of main theorems
        run: |
          lake env lean Cerny/AxiomCheck.lean > axiom-report.txt
          cat axiom-report.txt
          actual="$(grep -c 'depends on axioms:' axiom-report.txt)"
          if [ "$actual" -ne 21 ]; then
            echo "::error::Expected 21 audited theorems, found $actual"
            exit 1
          fi
          flat="$(tr '\n' ' ' < axiom-report.txt | tr -s ' ')"
          allowed="$(printf '%s' "$flat" | { grep -oF 'depends on axioms: [propext, Classical.choice, Quot.sound]' || true; } | wc -l)"
          if [ "$allowed" -ne "$actual" ]; then
            echo "::error::Unexpected axioms detected in main theorems"
            exit 1
          fi
          echo "::notice::Axiom audit passed: only [propext, Classical.choice, Quot.sound]"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
